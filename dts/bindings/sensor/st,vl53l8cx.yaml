description: STMicroelectronics VL53L8CX Time of Flight sensor
include: [sensor-device.yaml, i2c-device.yaml]
compatible: "st,vl53l8cx"
on-bus: i2c

properties:
  lpn-gpios:
    type: phandle-array
    description: |
      Enables i2c communication. 0 to disable 1 to enable.
      Required to perform sensor reset in STM provided driver.
    required: true
  pwr-gpios:
    type: phandle-array
    description: |
      Control AVDD, IOVDD and CORE_1V8, which is required to 
      perform sensor reset in STM provided driver code.
    required: true
  rdy-gpios:
    type: phandle-array
    description: |
      An interrupt is raised when a distance measurement is ready.
      A1 (pin number) GPIO1 (signal name) is the interrupt pin.
      It is not mandatory, user can poll instead.
  sync-gpios:
    type: phandle-array
    description: |
      Optional SYNC input. B1 (pin number) GPIO2 (signal name).
      General purpose I/O, defaults to open drain output (tristate), 
      47 kΩ pullup resistor required to IOVDD.
